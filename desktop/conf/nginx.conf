worker_processes  1;
error_log  "{{LOGS}}/nginx_err.log";
pid        "{{LOGS}}/nginx.pid";

events {
    worker_connections 1024;
}

http {
    include       "{{RUNTIME}}/nginx/conf/mime.types";
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # nginx 临时目录：相对路径会落到 conf_prefix（配置文件所在目录），必须给绝对路径
    client_body_temp_path "{{RUNTIME}}/nginx/temp/client_body";
    fastcgi_temp_path       "{{RUNTIME}}/nginx/temp/fastcgi";
    proxy_temp_path         "{{RUNTIME}}/nginx/temp/proxy";

    server {
        listen      8080;
        server_name localhost;
        root  "{{ROOT}}";
        index index.php index.html;

        # 隐藏敏感文件
        location ~ /(config|\.env|backups|uploads|updates)/ {
            deny all;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
            # PHP 端单次外部请求超时设的是 120s（规格书下载等），
            # nginx 默认 fastcgi_read_timeout 只有 60s → 长任务会被网关掐断成 504，
            # 前端只看到"网关超时"，看不到真实进度。这里对齐到 180s。
            fastcgi_read_timeout  180s;
            fastcgi_send_timeout  180s;
            fastcgi_connect_timeout 180s;
            include        "{{RUNTIME}}/nginx/conf/fastcgi_params";
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
