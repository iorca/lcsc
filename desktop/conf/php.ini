; LCSC 桌面版 PHP 配置（Windows PHP 8.3 NTS）
; extension_dir 相对 php 目录；php-cgi 通过 -c 指向本文件

extension_dir = "ext"

extension=pdo_mysql
extension=mbstring
extension=zip
extension=gd
extension=openssl
extension=curl
extension=fileinfo

date.timezone = "Asia/Shanghai"

; 上传 / 内存（按需求调整）
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 120

; 出站 HTTPS 需要的 CA 证书包。
; ⚠️ Windows 版 PHP **不自带** CA bundle，缺这一项会让所有 https 出站
; （立创商品查询 / 版本检测 / AI 接口）静默失败。
; {{CACERT}} 由启动器替换为 runtime 目录下的 cacert.pem 绝对路径；
; 该文件不存在时启动器会把这两行改回注释状态。
curl.cainfo = "{{CACERT}}"
openssl.cafile = "{{CACERT}}"
