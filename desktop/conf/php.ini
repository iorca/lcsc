; LCSC 桌面版 PHP 配置（Windows PHP 8.3 NTS）
; extension_dir 相对 php 目录；php-cgi 通过 -c 指向本文件

extension_dir = "ext"

extension=pdo_mysql
extension=mbstring
extension=zip
extension=gd
extension=openssl
extension=curl
extension=fileinfo

date.timezone = "Asia/Shanghai"

; 上传 / 内存（按需求调整）
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 120

; 作者天气 / 一言等出站 HTTPS 需要 CA：
; Windows 版通常自带，若提示证书错误，取消下面两行注释并指向本机 CA 包：
; curl.cainfo = ""
; openssl.cafile = ""
