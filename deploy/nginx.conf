# ─────────────────────────────────────────────────────────────
# Nginx 部署配置（LCSC 硬件资产管理）
# ─────────────────────────────────────────────────────────────
#
# **为什么需要这份文件**：项目的访问防护全部写在 4 个 `.htaccess` 里，而
# **Nginx 完全不读 `.htaccess`** —— 换到 Nginx 后若不做等价配置，
# `config.db.php`（含明文数据库密码）、`.installed`、`*.sql`、`dev/`、
# `app/`、`ui/`、`uploads/` 里的 PHP **全部失去保护**。
# 本文件是 Apache 那套规则的逐条等价实现（R-XPLAT-011 要求：承担安全职责的
# 规则必须在部署文档给出等价写法）。
#
# ── 为什么放在 deploy/ 而不是 docs/ ──
#
#   `docs/` 按设计**不进发布包**（见 dev/hc_rules.php 的 hcReleaseExclusions），
#   放那里则**拿到发布包的部署者手上没有这份文件** —— 而它恰恰是 Nginx 部署
#   唯一的安全防线来源。故放在根目录 `deploy/`，**随包发布**。
#   `deploy/` 自身也在 Web 根内，故 `deploy/.htaccess` 与上面第 14 条
#   `location ^~ /deploy/` 双重禁止访问该目录。
#
# ── 用法 ──
#   1. 放进 server{} 块内（不要放在 http{} 顶层）
#   2. **Web 根目录必须指向项目根目录**（不是 public/）—— 因为 app/、modules/、
#      ui/、mobile/ 下的 PHP 都要能被 Web 请求到
#   3. 按注释替换 server_name / root / fastcgi_pass 三处
#   4. 复制本文件到 Nginx 配置目录（如 /etc/nginx/conf.d/lcsc.conf）后 `nginx -t`
#
# ── 三条易错点（本文件已处理，改动时勿破坏）──
#   ① `location ^~ /app/` 会让**内部** location 不再参与匹配（^~ 是前缀里
#      优先级最高的一档）。所以 `= /app/api/router.php` 这条精确匹配必须写成
#      **精确匹配（`=`）**，它比 `^~` 优先，才能把公开 API 入口放行出去。
#      写错的表现：所有 API 一律 403。
#   ② 同理**不要给 `uploads/` 写任何 `^~` 前缀块** —— 那会抢在下面那条
#      「uploads 下 php 禁止执行」的正则之前命中，导致后者永不执行、
#      PHP 文件可被直接访问。正确做法见第 11 条的注释。
#   ③ `deny all;` / `root ...;` 都要带分号，漏分号是 500 的头号原因。
#
# 对应 Apache 侧：/.htaccess /app/.htaccess /ui/.htaccess /uploads/.htaccess
# 随项目 v1.2.0 交付。

server {
    listen       80;
    server_name  你的域名或IP;          # ← 改这里
    root         /var/www/lcsc;         # ← 改这里（项目根目录，不是 public/）

    charset utf-8;
    client_max_body_size 32m;           # 与 install.php 的上传上限协调

    # 真实客户端 IP：只信任本机 / Docker 网桥 / 内网反代来源
    # 宿主机反代必须设置 proxy_set_header X-Real-IP $remote_addr;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;
    real_ip_recursive on;

    # ── PHP-FPM（Unix socket 版）──
    # Windows 下把 fastcgi_pass 改为 127.0.0.1:9000
    index index.php;

    # 9.1) ui/ 下只有布局 / 组件 PHP 需要保护；ui/themes 下的 CSS / JS 是公开静态资源。
    #      ⚠️ 不能写成 `location ^~ /ui/ { deny all; }`：
    #      ui/layouts/head.php 的样式表就在 ui/themes/ 下，整目录拒绝会让全站 CSS 404。
    #      本规则必须放在全局 PHP location **之前**，否则 `location ~ \.php$` 会先命中。
    location ~ ^/ui/.*\.php$ {
        deny all;
        access_log off;
    }

    location ~ \.php$ {
        # ⚠️ 本项目需要这三个 fastcgi_param，否则 getClientIP() 取不到 HTTPS 后的真实 IP
        #（Nginx 默认不传 HTTP_X_FORWARDED_PROTO，HTTPS 下会退化成 http，
        #  连带影响 sendSecurityHeaders() 里的 HSTS 是否发送）
        fastcgi_pass unix:/run/php/php-fpm.sock;   # ← 改这里
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_X_REAL_IP $http_x_real_ip;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }

    # ══════════════════════════════════════════════════════════
    # 一、逐条等价实现根 .htaccess
    # ══════════════════════════════════════════════════════════

    # 1) 禁止目录列表（.htaccess 的 `Options -Indexes`）
    #    Nginx 默认就不开目录列表，这里显式写明以免被全局配置打开
    autoindex off;

    # 2) 敏感后缀：sql|md|log|ini|sh|bak（.htaccess FilesMatch 第一条）
    #    含 .conf —— 本目录下的 nginx.conf 含 root / fastcgi_pass 等部署细节，
    #    虽无凭据，但属内部配置，不该被公开下载
    location ~* \.(sql|md|log|ini|sh|bak|conf)$ {
        deny all;
        access_log off;
    }

    # 3) 配置文件：config.php（.htaccess Files "config.php"）
    #    ⚠️ 必须单独列 —— 上面那个后缀列表不含 php
    location = /config.php {
        deny all;
        access_log off;
    }

    # 4) 数据库凭据：config.db.php（2026-10-10 新增）
    #    Apache 侧同条已补齐；这里必须精确匹配，因为它是 .php 且不含点号
    location = /config.db.php {
        deny all;
        access_log off;
    }

    # 5) 点文件（.git / .htaccess / .installed 等）—— .htaccess FilesMatch "^\."
    #    含所有以点开头的路径，故 .installed 已被这条覆盖
    location ~ /\. {
        deny all;
        access_log off;
    }

    # 6) 开发期工具目录（.htaccess RedirectMatch 404 ^/dev/）
    #    dev/ 不进发布包，但即便误发也要拒访问（防源码泄露）
    location ^~ /dev/ {
        deny all;
        access_log off;
    }

    # 7) 版本与依赖文件（.htaccess FilesMatch "\.(json|lock)$"）
    location ~* \.(json|lock)$ {
        deny all;
        access_log off;
    }

    # 7.1) 在线升级工作区（P2，.htaccess RedirectMatch 404 ^/updates/）
    #      内含下载的安装包、staging、旧版本源文件回滚副本 —— **整目录拒绝**
    #      （^~ 前缀在此是安全的：本目录不接受任何内部 location，就是要全挡）
    location ^~ /updates/ {
        deny all;
        access_log off;
    }

    # 7.2) 备份目录（backups/）：数据库备份与导出文件，整目录拒绝
    #      （.sql 已被第 2 条拦；.xls / .xlsx / .csv 不在后缀列表内）
    location ^~ /backups/ {
        deny all;
        access_log off;
    }

    # ══════════════════════════════════════════════════════════
    # 二、逐条等价实现 app/.htaccess 与 ui/.htaccess
    # ══════════════════════════════════════════════════════════

    # 8) 公开 API 入口必须放行 —— **精确匹配**（易错点①：写成 ^~ 或前缀则会被
    #    下面第 9 条的 ^~ /app/ 抢先匹配而 deny 掉，表现为「所有 API 都 403」
    location = /app/api/router.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_X_REAL_IP $http_x_real_ip;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    # 9) app/ 下其余文件全部禁止（仅供 PHP require/include）
    location ^~ /app/ {
        deny all;
        access_log off;
    }

    # 10) ui/ 下的布局 / 组件 PHP 禁止直接访问
    #      CSS / JS 必须放行（规则见上方「9.1」），整目录 deny 会导致全站无样式。

    # ══════════════════════════════════════════════════════════
    # 三、uploads/ 的 PHP 执行禁止（等价 uploads/.htaccess）
    # ══════════════════════════════════════════════════════════

    # 11) **uploads 下的 PHP 一律禁止执行**，而图片 / PDF / 附件原样放行。
    #
    #     ⚠️ 易错点②（这里最容易写错）：**不能**写成
    #         location ^~ /uploads/ { deny all; }   ← 图片也全挡了
    #     也不能在下面再放一条 `location ^~ /uploads/` 让它抢在前面 ——
    #     ^~ 是前缀里优先级最高的档，一旦命中就**不再匹配任何内部 location**，
    #     写在它后面的那条 php 正则就永远不会执行，形同虚设。
    #
    #     正确结构：只放这一条正则 deny，其余 uploads 文件**交给默认的
    #     `location /` 处理**（不写任何 uploads 前缀块），这样互不干扰。
    location ~ ^/uploads/.*\.(php|php3|php4|php5|php7|phtml|pht|phar|inc)$ {
        deny all;
        access_log off;
    }

    # 12) uploads 下的静态资源：设长缓存 + 可读
    #     （与 asset.thumb 接口的 immutable 一年强缓存不冲突：那是 PHP 动态输出，
    #     走location ~ \.php$，不经过这里）
    location ~* ^/uploads/.*\.(css|js|png|jpg|jpeg|gif|ico|svg|webp|pdf|xls|xlsx|csv)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # 13) CSS / JS / 图片等静态资源
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ══════════════════════════════════════════════════════════
    # 四、部署配置目录本身（等价 deploy/.htaccess）
    # ══════════════════════════════════════════════════════════

    # 14) 本目录放的是服务器配置（含 root / fastcgi_pass / 域名），
    #     属内部部署信息，不该被公开下载。与 deploy/.htaccess 等价。
    location ^~ /deploy/ {
        deny all;
        access_log off;
    }

    # ══════════════════════════════════════════════════════════
    # 五、安全头（等价根 .htaccess 的 <IfModule mod_headers.c> 段）
    # ══════════════════════════════════════════════════════════

    # ⚠️ 这三个头与 PHP 侧 sendSecurityHeaders() 发的是**同名头**。
    #    Nginx 重复下发同名头时浏览器以哪一条为准未定义，故这里只补 Nginx 层，
    #    且值必须与 PHP 侧**保持一致**（改一处要记得改另一处）。
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ══════════════════════════════════════════════════════════
    # 六、自检清单（部署后逐条 curl 验证，期望结果见括号）
    # ══════════════════════════════════════════════════════════
    # curl -I http://你的域名/config.db.php        → 403
    # curl -I http://你的域名/.installed            → 403
    # curl -I http://你的域名/dev/hc_rules.php     → 403
    # curl -I http://你的域名/deploy/nginx.conf    → 403（部署者从磁盘读，不经 Web）
    # curl -I http://你的域名/app/core/Middleware.php → 403
    # curl -I http://你的域名/ui/layouts/head.php  → 403
    # curl -I http://你的域名/version.json          → 403
    # curl -I http://你的域名/backups/xxx.sql       → 403
    # curl -I http://你的域名/backups/xxx.xlsx      → 403（整目录拒绝）
    # curl -I http://你的域名/ui/themes/common.css  → 200（CSS 必须放行）
    # curl -I http://你的域名/uploads/evil.php      → 403
    # curl -I http://你的域名/login.php             → 200（正常放行）
    # curl    'http://你的域名/api.php?action=...' → JSON（说明 router.php 已放行）
    #
    # 若【接口全 403】→ 第 8 条没写成精确匹配 `=`（易错点①）
    # 若【图片打不开】 → 第 11/12 条写反了（易错点②）
    # 若【配置 500】   → 检查 location 块是否漏分号（易错点③）
    # ══════════════════════════════════════════════════════════

}